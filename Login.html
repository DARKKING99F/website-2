<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minigames
    </title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,
                    #020617 0%,
                    #1e3a8a 30%,
                    #4f46e5 65%,
                    #38bdf8 100%);
            min-height: 100vh;
        }

        header {

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 18px 50px;

            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(255, 255, 255, .15);

            position: sticky;
            top: 0;
            z-index: 999;

        }

        .logo {

            color: #4da6ff;
            font-size: 28px;
            font-weight: bold;

            text-shadow: 0 0 15px #4da6ff;

        }

        nav {

            display: flex;
            gap: 30px;

        }

        nav a {

            color: white;
            text-decoration: none;

            padding: 10px 18px;

            border-radius: 8px;

            transition: .3s;

        }

        nav a:hover {

            background: #4da6ff;
            color: white;

            box-shadow: 0 0 15px #4da6ff;

        }

        /* Responsive */

        @media(max-width:700px) {

            header {

                flex-direction: column;
                gap: 20px;
                padding: 20px;

            }

            nav {

                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;

            }

        }

        nav a.active {

            background: #4da6ff;

            box-shadow: 0 0 15px #4da6ff;

        }
    </style>
</head>

<header>

    <div class="logo">
        ⚡ Roblox Script
    </div>

    <nav>
        <a href="home.html">Home</a>
        <a href="minigames.html">Minigames</a>
        <a href="help.html">Help</a>
        <a href="about.html">About</a>
        <a href="login.html">Login</a>
    </nav>

</header>

<body>

</body>

</html>
